name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-deny
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-deny

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features
        env:
          # Private leak-guard patterns (never committed); empty when the secret is unset.
          KIPI_LEAK_DENYLIST: ${{ secrets.KIPI_LEAK_DENYLIST }}

      - name: cargo deny
        run: cargo deny check

  coverage:
    # Report-only: branch coverage of the pure resolver (roadmap §13 targets 100%).
    # Branch coverage needs nightly, so this job never gates a merge.
    name: coverage (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install nightly with llvm-tools
        run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-llvm-cov

      - name: Branch coverage of resolve.rs
        run: |
          cargo +nightly llvm-cov -p kipi-core --test resolve --test resolve_props \
            --branch --summary-only | tee coverage.txt
          {
            echo '### Coverage (report-only)'
            echo '```'
            grep -E 'Filename|resolve\.rs|plan\.rs' coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
