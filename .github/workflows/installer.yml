# Install kipi from a *published* release with the shell installer, on clean machines,
# and run the fresh-machine end to end against the installed binary. This is what a user
# does, so it catches problems the build-from-source jobs in ci.yml cannot: a broken
# installer, a wrong asset name, a binary that does not run on the target.
#
# Runs after every successful tag-push run of the Release workflow, and on demand for any tag:
#   gh workflow run installer.yml -f version=v0.1.1
#
# Not `release: published`: dist's `host` job publishes the release with `GITHUB_TOKEN`, and
# events caused by `GITHUB_TOKEN` start no workflow runs. The Release run itself was started by
# the maintainer's tag push, so its completion does fire `workflow_run`. GitHub only reads
# `workflow_run` triggers from the default branch's copy of this file.
name: Installer

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to install (e.g. v0.1.1)"
        required: true

permissions:
  contents: read

jobs:
  install:
    name: install ${{ matrix.name }}
    # A finished Release run triggers this too when it was a PR dry run or failed; install only
    # after a successful tag push (`head_branch` is the tag name for a tag push).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          # A bare Debian container: no Rust, no kipi, only what the installer needs.
          - name: linux x86_64 (container)
            os: ubuntu-latest
            container: debian:stable-slim
          - name: linux arm64
            os: ubuntu-24.04-arm
          - name: macos arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      VERSION: ${{ github.event.workflow_run.head_branch || inputs.version }}
    steps:
      - name: Install prerequisites (container)
        if: matrix.container != ''
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl git xz-utils >/dev/null

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.VERSION }}

      - name: Install ${{ env.VERSION }} with the published shell installer
        shell: sh
        run: |
          export CARGO_HOME="$RUNNER_TEMP/kipi-home"
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/kipi-cli-installer.sh" \
            | sh -s -- --no-modify-path
          "$CARGO_HOME/bin/kipi" --version
          want="kipi ${VERSION#v}"
          test "$("$CARGO_HOME/bin/kipi" --version)" = "$want" || { echo "expected: $want"; exit 1; }
          echo "KIPI_BIN=$CARGO_HOME/bin/kipi" >> "$GITHUB_ENV"

      - name: Fresh-machine end to end against the installed binary
        shell: sh
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          sh scripts/fresh-machine-e2e.sh "$KIPI_BIN"
