[package]
name = "kipi-cli"
description = "kipi: a scoped map of your local repos and shared skills for LLM coding agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "kipi"
path = "src/main.rs"

[dependencies]
kipi-core.workspace = true
clap.workspace = true
# The dynamic engine completes repo, skill and alias names (docs/decisions.md, Stage 4).
clap_complete = { workspace = true, features = ["unstable-dynamic"] }
owo-colors.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
insta.workspace = true
kipi-test-support.workspace = true
predicates.workspace = true
tempfile.workspace = true
walkdir.workspace = true

# The Homebrew formula is `kipi`, not the package name (dist-workspace.toml).
[package.metadata.dist]
formula = "kipi"

[lints]
workspace = true
