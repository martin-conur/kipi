[workspace]
resolver = "3"
members = ["crates/kipi-core", "crates/kipi-cli", "crates/kipi-test-support"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/martin-conur/kipi"
homepage = "https://github.com/martin-conur/kipi"

# The full §12 dependency set, pinned here and nowhere else. Member crates opt in
# with `<dep>.workspace = true`. Adding a crate outside this list needs a recorded
# decision in docs/decisions.md; `deny.toml` bans network, libgit2 and SQLite crates.
[workspace.dependencies]
kipi-core = { path = "crates/kipi-core", version = "0.1.0" }
kipi-test-support = { path = "crates/kipi-test-support", version = "0.1.0" }

clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml_edit = { version = "0.25.15", features = ["serde"] }
yaml-rust2 = "0.13.0"
minijinja = "2.24.0"
thiserror = "2.0.21"
anyhow = "1.0.104"
ignore = "0.4.33"
regex = "1.13.1"
walkdir = "2.5.0"
tiktoken-rs = "0.12.1"
owo-colors = "4.4.0"
tempfile = "3.27.0"
sha2 = "0.11.0"
dirs = "7.0.0"

# dev-only
insta = "1.49.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"
proptest = "1.11.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Dependencies are built optimized even in dev and test builds (kipi's own crates stay
# unoptimized for fast rebuilds): the `tree` < 100 ms test runs the debug binary, whose
# time is otherwise dominated by unoptimized hashing, templating and parsing.
[profile.dev.package."*"]
opt-level = 2

# The profile release artifacts are built with (cargo-dist, dist-workspace.toml).
[profile.dist]
inherits = "release"
lto = "thin"
